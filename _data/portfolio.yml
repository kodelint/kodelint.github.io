case_studies:
  - id: platform-modernization-gitops
    title: "Zero to Production-Grade: Rebuilding Mandolin's Entire Cloud Platform from Scratch"
    outcome: "77% infra cost reduction, 40% MTTR reduction, 53 days, solo execution (while building a team from scratch)"
    context: "Mandolin is a healthcare AI startup ($40M Series A, Greylock), operating in hyper-growth with HIPAA/GDPR compliance requirements and enterprise healthcare tenants."
    role: "Head of Engineering and Infrastructure — Mandolin"
    problem: "Four deployment systems, no source of truth, every service on a public endpoint no segmentation, no mTLS, static credentials scattered across codebases. No DR, no defined RTO. Huge operating cost with 45 to 1 hour per build and zero developer self-service."
    constraints: "Zero production downtime, solo execution, live healthcare enterprise tenants throughout, HIPAA and GDPR compliance from day one."
    solution:
      - "Multi-cluster GKE across 4 GCP projects self-hosted ArgoCD, Argo Workflows + BuildKit CI, ARC runners. Replaced all managed SaaS."
      - "Private-by-default networking internal LBs, per-tenant mTLS, ESO + Secret Manager, Workload Identity. Zero static credentials. MongoDB Atlas → Cloud SQL PostgreSQL migration."
      - "Resolve.ai for AI-driven incident triage (40% MTTR reduction); Pulumi Neo for AI-assisted IaC two tools that multiplied solo engineering leverage."
      - "AI-driven OCR pipeline for automated data extraction from prior auth forms and insurance documents eliminated manual entry across the specialty drug intake workflow."
      - "Designing and implementing in-house model training infrastructure QLoRA fine-tuning, eval harnesses, and LangGraph agentic workflows to support proprietary healthcare AI."
      - "LiteLLM gateway on GKE fronting Vertex AI, with Presidio PHI redaction and OpenTelemetry tracing on every model call."
      - "Developer portal + Glean AI search onboarding and knowledge discovery time cut 50%."
      - "Reinvented the developer production workflow using AI-assisted IaC and automated incident triage."
      - "OPA/Kyverno compliance guardrails, Wiz + Snyk vulnerability scanning, Kubecost + BigQuery FinOps."
    impact:
      - "77% reduction in monthly infrastructure spend ($250K → $57K) while simultaneously growing the resource footprint."
      - "40% reduction in MTTR via Resolve.ai-automated incident triage."
      - "CI builds: 45 minutes → 23 minutes (49% faster). Tenant onboarding: 2–3 days → 30 minutes."
      - "DR RTO: undefined → <10 min. Zero public endpoints. HIPAA/GDPR-compliant from day one."
      - "Developer onboarding and knowledge discovery time cut by 50% via Glean AI search"
      - "Educated engineering org on AI-assisted development using Claude Code and OpenAI/Codex established HIPAA-safe usage policies, dynamic workflow guardrails, and team-wide training that accelerated code delivery and code quality with zero AI-related compliance incidents."
    lessons:
      - "AI tooling (Resolve.ai, Pulumi Neo, Glean) multiplied solo engineering leverage treating AI as a force-multiplier is now a first-class infrastructure strategy."
      - "GitOps-as-the-only-write-path is an architectural constraint, not a configuration design it in from day one."
      - "Right-sizing requires 3 months of production samples — 30 days misses peak CPU by up to 44%."
    artifacts: []
    tags: ["GitOps", "GKE", "Healthcare", "AI Tools", "Platform Engineering"]

  - id: adobe-hyperscale
    title: "Hyperscale ML/Search Platform at Adobe"
    outcome: "Multi Billion requests, GPU utilization +38%"
    context: "Adobe's Core Search and Sensei platform serves as the intelligence layer behind flagship products, processing 30B+ daily requests."
    role: "Architect & Technical Leader"
    problem: "AI/ML workloads were outgrowing the existing infrastructure, creating scaling, latency, and cost challenges."
    constraints: "Sub‑5ms P95 latency, strict data governance, and legacy systems that couldn’t be disrupted."
    solution:
      - "Designed a hybrid GPU/CPU architecture across AWS, Azure, and on‑prem HPC."
      - "Optimized NVIDIA clusters using RDMA InfiniBand, MIG, and Volcano scheduling."
      - "Unified fragmented Kubernetes environments into a multi‑tenant platform."
    impact:
      - "Supported 30B+ daily API requests with >99.98% availability."
      - "Increased GPU utilization by 38% through smarter scheduling."
      - "Reduced cloud storage costs by 65% with tiering and lifecycle policies."
    lessons:
      - "GPU-aware scheduling is the difference between expensive hardware and efficient hardware."
      - "Hybrid cloud is complex, but it unlocks elasticity and cost control at hyperscale."
    artifacts:
      - text: "Architecture Diagram"
        link: "#"
    tags: ["AI/ML", "HPC", "Kubernetes"]

  - id: adobe-elasticsearch-consolidation
    title: "Enterprise Elasticsearch Consolidation at Adobe"
    outcome: "Millions in annual savings, 30% cost reduction"
    context: "Adobe’s search infrastructure was fragmented across 18+ managed clusters with varying versions, driving high licensing costs and operational complexity."
    role: "Architect & Technical Leader"
    problem: "Managed service lock-in and version fragmentation were creating a multi-million dollar licensing burden without the necessary operational control."
    constraints: "10B+ documents, 6K/sec ingestion, zero-downtime migration requirement."
    solution:
      - "Migrated 18 managed AWS Elasticsearch clusters to a standardized, self-managed hybrid architecture."
      - "Transitioned the entire stack from proprietary managed versions to a unified Open Source version."
      - "Engineered automated data lifecycle and tiering policies for 10B+ documents."
    impact:
      - "Reduced annual Elasticsearch licensing costs by millions of dollars (30% net savings)."
      - "Achieved full operational control over search performance and security posture."
      - "Maintained sub-5ms P95 search latency while sustaining 6K/sec ingestion throughput."
    lessons:
      - "Standardization is the prerequisite for cost optimization at scale."
      - "Moving to Open Source provides financial leverage and eliminates vendor lock-in."
    artifacts:
      - text: "Migration Strategy"
        link: "#"
    tags: ["Elasticsearch", "Open Source", "Cost Optimization"]

  - id: f5-sre-transformation
