  - id: f5-security-compliance
    title: "FedRAMP High & Zero-Trust Architecture at F5"
    outcome: "FedRAMP High, PCI-DSS, SOC 2"
    context: "F5's Distributed Cloud platform required the highest levels of security to serve federal and highly regulated enterprise customers."
    role: "Sr. Director of Product Engineering & Head of SRE"
    problem: "Achieving and sustaining high-bar compliance (FedRAMP High) while maintaining rapid feature velocity in a multi-cloud environment."
    constraints: "Global footprint (21+ PoPs), complex multi-tenant networking, and zero-trust requirements."
    solution:
      - "Architected a zero-trust platform using mutual TLS (mTLS), identity-based policy, and runtime eBPF monitoring."
      - "Implemented 'Compliance-as-Code' to automate security guardrails across the entire CI/CD lifecycle."
      - "Collaborated with the CISO to deliver FedRAMP High, PCI-DSS, and SOC 2 compliance through automated evidence collection."
