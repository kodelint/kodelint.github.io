<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | Satyajit Roy</title>
  
  {% seo %}
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/portfolio.css">
  
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Satyajit Roy",
    "jobTitle": "Director of Engineering & SRE",
    "url": "{{ site.url }}/portfolio/",
    "sameAs": [
      "https://www.linkedin.com/in/satyajitroychoudhury/",
      "https://github.com/kodelint"
    ]
  }
  </script>
</head>
<body>

  <nav class="p-nav">
    <div class="p-container p-nav-inner">
      <a href="{{ "/portfolio/" | relative_url }}" class="p-logo">Satyajit Roy</a>
      <div class="p-links">
        <a href="{{ "/portfolio/" | relative_url }}" class="p-link {% if page.url == '/portfolio/' %}active{% endif %}">Home</a>
        <a href="{{ "/portfolio/case-studies/" | relative_url }}" class="p-link {% if page.url contains 'case-studies' %}active{% endif %}">Case Studies</a>
        <a href="{{ "/portfolio/leadership/" | relative_url }}" class="p-link {% if page.url contains 'leadership' %}active{% endif %}">Leadership</a>
        <a href="{{ "/portfolio/writing/" | relative_url }}" class="p-link {% if page.url contains 'writing' %}active{% endif %}">Writing</a>
        <a href="{{ "/portfolio/oss/" | relative_url }}" class="p-link {% if page.url contains 'oss' %}active{% endif %}">OSS</a>
        <a href="{{ "/portfolio/resume/" | relative_url }}" class="p-link {% if page.url contains 'resume' %}active{% endif %}">Resume</a>
        <a href="{{ "/portfolio/contact/" | relative_url }}" class="p-link {% if page.url contains 'contact' %}active{% endif %}">Contact</a>
      </div>
    </div>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer class="p-footer">
    <div class="p-container">
      <p>&copy; {{ site.time | date: '%Y' }} Satyajit Roy. All rights reserved.</p>
      <div style="margin-top: 1rem;">
        <a href="https://www.linkedin.com/in/satyajitroychoudhury/" target="_blank" style="margin: 0 0.5rem;"><i class="fab fa-linkedin"></i></a>
        <a href="https://github.com/kodelint" target="_blank" style="margin: 0 0.5rem;"><i class="fab fa-github"></i></a>
        <a href="https://twitter.com/__initialized__" target="_blank" style="margin: 0 0.5rem;"><i class="fab fa-x-twitter"></i></a>
        <a href="mailto:talk2sroy.ch@gmail.com" style="margin: 0 0.5rem;" title="Personal Site"><i class="fas fa-envelope"></i></a>
      </div>
    </div>
  </footer>

</body>
</html>
