<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | Satyajit Roy</title>
  <meta name="description" content="{{ page.description | default: 'Engineering leader specializing in hyperscale AI/ML infrastructure, SRE, and cloud cost optimization.' }}">
  
  <!-- SEO & OpenGraph -->
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="/assets/css/portfolio_v4.css">
  
  {% seo title=false %}
  
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Satyajit Roy",
    "jobTitle": "Director of Engineering & SRE",
    "url": "{{ site.url }}/portfolio/",
    "sameAs": [
      "https://www.linkedin.com/in/satyajitroychoudhury/",
      "https://github.com/kodelint",
      "{{ site.url }}"
    ],
    "description": "Engineering leader specializing in hyperscale AI/ML infrastructure, SRE, and cloud cost optimization."
  }
  </script>
</head>
<body>

  <nav class="v4-nav">
    <div class="container nav-wrapper">
      <a href="/portfolio/" class="nav-logo">Satyajit Roy</a>
      <div class="nav-links">
        <a href="/portfolio/" class="nav-link {% if page.url == '/portfolio/' %}active{% endif %}">Home</a>
        <a href="/portfolio/case-studies/" class="nav-link {% if page.url contains 'case-studies' %}active{% endif %}">Case Studies</a>
        <a href="/portfolio/leadership/" class="nav-link {% if page.url contains 'leadership' %}active{% endif %}">Leadership</a>
        <a href="/portfolio/writing/" class="nav-link {% if page.url contains 'writing' %}active{% endif %}">Writing</a>
        <a href="/portfolio/oss/" class="nav-link {% if page.url contains 'oss' %}active{% endif %}">OSS</a>
        <a href="/portfolio/resume/" class="nav-link {% if page.url contains 'resume' %}active{% endif %}">Resume</a>
        <a href="/portfolio/contact/" class="nav-link {% if page.url contains 'contact' %}active{% endif %}">Contact</a>
      </div>
    </div>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer class="v4-footer">
    <div class="container">
      <p>&copy; {{ site.time | date: '%Y' }} Satyajit Roy. Engineering Leadership.</p>
      <div class="footer-links">
        <a href="https://www.linkedin.com/in/satyajitroychoudhury/">LinkedIn</a>
        <a href="https://github.com/kodelint">GitHub</a>
        <a href="/portfolio/contact/">Contact</a>
      </div>
    </div>
  </footer>

</body>
</html>
