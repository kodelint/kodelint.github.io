<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />

  <link rel="manifest" href="{{site.url}}{{site.baseurl}}/manifest.json" />
  {% seo %}
  <link
    rel="stylesheet"
    href="{{site.url}}{{site.baseurl}}/assets/css/main.css?v={{ 'now' | date: '%s' }}"
  />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesk:opsz,wght@12..96,200..800&family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Sora:wght@100..800&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/gsap.min.js"></script>
  <script type="module">
    import "https://cdn.jsdelivr.net/npm/@pwabuilder/pwaupdate";
    const el = document.createElement("pwa-update");
    document.body.appendChild(el);
  </script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    
    document.addEventListener('DOMContentLoaded', async () => {
      // Transform Jekyll code blocks to mermaid divs
      const mermaidCodeBlocks = document.querySelectorAll('pre code.language-mermaid');
      
      mermaidCodeBlocks.forEach(codeBlock => {
        const preElement = codeBlock.parentElement; // The <pre>
        const container = preElement.parentElement.classList.contains('highlight') 
                          ? preElement.parentElement.parentElement // The outer div.language-mermaid
                          : preElement;

        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = codeBlock.textContent;
        
        container.replaceWith(div);
      });

      mermaid.initialize({ startOnLoad: true, theme: 'dark' });
    });
  </script>
</head>
